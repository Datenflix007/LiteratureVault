<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">Projektordner und Zotero-Sammlung</title><desc id="desc">Anonymisierte Darstellung der synchronisierten Projektordner und der passenden Zotero-Sammlung.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07131f"/><stop offset="1" stop-color="#152442"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#3dc4fa"/><stop offset="1" stop-color="#39c878"/></linearGradient></defs>
  <rect width="1440" height="810" fill="url(#bg)"/><text x="92" y="99" fill="#f5fbff" font-family="Arial, sans-serif" font-size="35" font-weight="700">Ein Projekt, zwei geordnete Ansichten</text><text x="92" y="134" fill="#9dbbd2" font-family="Arial, sans-serif" font-size="17">Die UI verwaltet den lokalen Projektordner. Das Zotero-Plugin erzeugt die passende Sammlung.</text>
  <rect x="92" y="205" width="539" height="470" rx="18" fill="#0c1b2a" stroke="#28536d"/><rect x="117" y="231" width="47" height="47" rx="12" fill="#1e88bf"/><path d="M130 250h21v15h-21z" fill="none" stroke="#ddf6ff" stroke-width="3"/><text x="181" y="261" fill="#e9f7ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Synchronisierter Ordner</text><text x="126" y="324" fill="#7bd5fd" font-family="Arial, sans-serif" font-size="16" font-weight="700">▾  Projekte</text><text x="157" y="370" fill="#f3f9fe" font-family="Arial, sans-serif" font-size="18">▾  Stadtgeschichte</text><text x="190" y="414" fill="#b3ccdd" font-family="Arial, sans-serif" font-size="17">▸  Literatur</text><text x="190" y="455" fill="#b3ccdd" font-family="Arial, sans-serif" font-size="17">▸  Quellen</text><text x="190" y="496" fill="#819fb7" font-family="Arial, sans-serif" font-size="15">▸  Aufgaben &amp; Projektdaten</text><rect x="126" y="548" width="468" height="82" rx="10" fill="#102b37" stroke="#2c8278"/><text x="148" y="579" fill="#7de4cf" font-family="Arial, sans-serif" font-size="14" font-weight="700">ONE DRIVE / NEXTCLOUD / DROPBOX</text><text x="148" y="606" fill="#c1dde3" font-family="Arial, sans-serif" font-size="14">Desktop-Client synchronisiert diesen lokalen Ordner.</text>
  <path d="M686 428h71" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><path d="M746 406l27 22-27 22" fill="none" stroke="#50d4aa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="677" y="380" fill="#91e3d1" font-family="Arial, sans-serif" font-size="13" font-weight="700">ABGLEICH</text>
  <rect x="810" y="205" width="539" height="470" rx="18" fill="#171222" stroke="#695389"/><rect x="835" y="231" width="47" height="47" rx="12" fill="#7d55ab"/><path d="M846 248h25v17h-25z" fill="none" stroke="#f2e9ff" stroke-width="3"/><text x="899" y="261" fill="#f8f3ff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Zotero · Meine Bibliothek</text><text x="844" y="324" fill="#d3c2ef" font-family="Arial, sans-serif" font-size="16" font-weight="700">▾  Meine Bibliothek</text><text x="875" y="370" fill="#f7f3ff" font-family="Arial, sans-serif" font-size="18">▾  Stadtgeschichte</text><text x="908" y="414" fill="#d8c8ee" font-family="Arial, sans-serif" font-size="17">▸  Literatur</text><text x="908" y="455" fill="#d8c8ee" font-family="Arial, sans-serif" font-size="17">▸  Quellen</text><text x="908" y="496" fill="#aa96c2" font-family="Arial, sans-serif" font-size="15">Einträge erscheinen im Quellenregal der UI</text><rect x="844" y="548" width="468" height="82" rx="10" fill="#2b203b" stroke="#7b58a1"/><text x="866" y="579" fill="#dbbfff" font-family="Arial, sans-serif" font-size="14" font-weight="700">MYLITERATUREVAULT-PLUGIN</text><text x="866" y="606" fill="#eadcf8" font-family="Arial, sans-serif" font-size="14">Erstellt die Sammlung und ordnet importierte Metadaten zu.</text>
</svg>
