services:
  webdav:
    image: bytemark/webdav
    container_name: zotero-webdav
    restart: unless-stopped
    # Keep Docker's effective credentials in sync with the local setup file.
    # Keep the container credentials in sync with the local, ignored .env file.
    env_file:
      - .env
    ports:
      - "8080:80"
    environment:
      AUTH_TYPE: Basic
    # The host folder is deliberately outside the repository.  Point this at a
    # folder synced by OneDrive, Nextcloud Desktop or Dropbox (see .env).
    volumes:
      - type: bind
        source: ${ZOTERO_STORAGE_PATH:-./data}
        target: /var/lib/dav/data
