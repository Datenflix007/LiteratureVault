services:
  webdav:
    image: bytemark/webdav
    container_name: zotero-webdav
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: ${WEBDAV_USERNAME:-zotero}
      PASSWORD: ${WEBDAV_PASSWORD:-changeme123}
    # The host folder is deliberately outside the repository.  Point this at a
    # folder synced by OneDrive, Nextcloud Desktop or Dropbox (see .env.local).
    volumes:
      - type: bind
        source: ${ZOTERO_STORAGE_PATH:-./data}
        target: /var/lib/dav/data
